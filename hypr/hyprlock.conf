# BACKGROUND
background {
    monitor =
    path = /home/enwveki/Pictures/gruvbox_tux.png
    blur_passes = 3
    blur_size = 7
    contrast = 1.1
    brightness = 0.6
    vibrancy = 0.3
    vibrancy_darkness = 0.3
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor = DP-1
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(142, 192, 124)
    inner_color = rgb(29, 32, 33)
    font_color = rgb(235, 219, 178)
    fade_on_empty = true
    fade_timeout = 1000
    rounding = 12
    check_color = rgb(184, 187, 38)
    fail_color = rgb(251, 73, 52)
    placeholder_text = <span foreground="##a89984"><i>Enter Password...</i></span>
    fail_text = <span foreground="##fb4934"><i>$FAIL ($ATTEMPTS)</i></span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
}

# USER LABEL
label {
    monitor = DP-1
    text = cmd[update:1000] echo "Welcome, $USER"
    color = rgb(184, 187, 38)
    font_size = 24
    font_family = JetBrains Mono Bold
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.7)
}

# DATE
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<span foreground='##8ec07c'>$(date +"%A")</span>, <span foreground='##d5c4a1'>$(date +"%B %d")</span>"
    color = rgb(213, 196, 161)
    font_size = 22
    font_family = JetBrains Mono Medium
    position = 0, 380
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.7)
}

# TIME
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<span foreground='##b8bb26'>$(date +"%-I")</span><span foreground='##689d6a'>:</span><span foreground='##8ec07c'>$(date +"%M")</span><span foreground='##d5c4a1'>$(date +"%p")</span>"
    color = rgb(213, 196, 161)
    font_size = 120
    font_family = JetBrains Mono Extrabold
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.8)
}

# Profile Picture
image {
    monitor = DP-1
    path = /home/enwveki/Pictures/avatar.png
    size = 120
    border_size = 4
    border_color = rgb(142, 192, 124)
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Desktop Environment Icon
image {
    monitor = DP-1
    path = /home/enwveki/Pictures/avatar.png
    size = 60
    border_size = 3
    border_color = rgb(104, 157, 106)
    position = -40, 40
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# CURRENT SONG
label {
    monitor = DP-1
    text = cmd[update:1000] echo "♫ $(/home/enwveki/.config/scripts/whatsong.sh)"
    color = rgb(142, 192, 124)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.7)
}

# HINT TEXT
label {
    monitor = DP-1
    text = <span foreground="##a89984"><i>Press ESC to cancel</i></span>
    color = rgb(168, 153, 132)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, 20
    halign = center
    valign = bottom
}